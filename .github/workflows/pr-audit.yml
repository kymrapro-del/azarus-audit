name: pr-audit

# Audit de sécurité automatique sur chaque pull request :
# azarus-audit scanne le code, publie les résultats dans l'onglet Security
# (SARIF / code scanning) et poste un résumé lisible en commentaire de PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF vers code scanning
  pull-requests: write      # commentaire de synthèse sur la PR

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Auditer avec azarus-audit
        id: audit
        uses: ./
        with:
          path: azarus_audit
          fail-on: never          # on annote, on ne bloque pas la PR

      - name: Publier le SARIF (onglet Security)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.audit.outputs.sarif-file }}
          category: azarus-audit

      - name: Commenter la PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- azarus-audit-report -->';
            let body;
            try {
              body = fs.readFileSync('${{ steps.audit.outputs.markdown-file }}', 'utf8');
            } catch (e) {
              return;  // pas de rapport : rien à publier
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
