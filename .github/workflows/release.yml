name: release

# Un tag vX.Y.Z publie automatiquement une GitHub Release à partir du CHANGELOG.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que VERSION correspond au tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          FILE="$(cat VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "Le tag ($TAG) ne correspond pas au fichier VERSION ($FILE)." >&2
            exit 1
          fi

      - name: Créer la release
        uses: softprops/action-gh-release@v2
        with:
          name: azarus-audit ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
